<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Command Center — Encrypted Telemetry</title>
    <style>
        :root {
            --bg: #070b14;
            --surface: #111827;
            --surface-2: #172033;
            --border: #2e3a4e;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lock-card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(145deg, #111827, #172033);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .lock-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .badge-crypto {
            display: inline-block;
            background: rgba(16, 185, 129, 0.12);
            color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-group input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #0a0f1d;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .input-group input[type="password"]:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .checkbox-row input {
            cursor: pointer;
            accent-color: var(--blue);
        }
        .btn-unlock {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 4px;
        }
        .btn-unlock:hover {
            background: #1d4ed8;
        }
        .btn-unlock:disabled {
            background: #1e3a8a;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            display: none;
            color: var(--red);
            font-size: 0.8rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
        }
        .loading-state {
            display: none;
            font-size: 0.84rem;
            color: var(--text-muted);
            text-align: center;
            padding: 8px;
        }
        .footer-note {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="lock-card">
        <div class="lock-icon">🔒</div>
        <h1>Quant Command Center</h1>
        <div class="subtitle">Multi-Pod Stage-2 Momentum Telemetry</div>
        <div class="badge-crypto">AES-256-GCM ZERO-KNOWLEDGE ENCRYPTED</div>

        <div id="loading" class="loading-state">⚡ Decrypting telemetry using saved session key...</div>

        <form id="unlock-form" onsubmit="handleUnlock(event)">
            <div id="error" class="error-msg">Incorrect passphrase. Decryption failed.</div>
            <div class="input-group">
                <label for="passphrase">Master Passphrase</label>
                <input type="password" id="passphrase" autocomplete="current-password" placeholder="Enter passphrase..." autofocus required>
            </div>
            <label class="checkbox-row">
                <input type="checkbox" id="remember-device" checked>
                <span>Remember on this device (instant auto-unlock)</span>
            </label>
            <button type="submit" id="submit-btn" class="btn-unlock">Unlock Command Center</button>
        </form>

        <div class="footer-note">Client-Side WebCrypto AES-GCM • Zero Server Credentials</div>
    </div>

    <script type="text/javascript">
        const STORAGE_KEY = "nifty_eod_dashboard_key";

        async function deriveKey(password, saltBytes, iterations) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: saltBytes,
                    iterations: iterations,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }

        async function attemptDecryption(password) {
            const payloadEl = document.getElementById("encrypted-payload");
            if (!payloadEl) return false;
            const data = JSON.parse(payloadEl.textContent);

            const saltBytes = Uint8Array.from(atob(data.salt), c => c.charCodeAt(0));
            const ivBytes = Uint8Array.from(atob(data.iv), c => c.charCodeAt(0));
            const ctBytes = Uint8Array.from(atob(data.ciphertext), c => c.charCodeAt(0));
            const iterations = parseInt(data.iterations || "100000", 10);

            const key = await deriveKey(password, saltBytes, iterations);
            const decryptedBuffer = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: ivBytes },
                key,
                ctBytes
            );

            const dec = new TextDecoder();
            const decryptedHtml = dec.decode(decryptedBuffer);

            // Successfully decrypted! Render document seamlessly
            document.open();
            document.write(decryptedHtml);
            document.close();
            return true;
        }

        async function handleUnlock(e) {
            if (e) e.preventDefault();
            const passInput = document.getElementById("passphrase");
            const errEl = document.getElementById("error");
            const btn = document.getElementById("submit-btn");
            const remember = document.getElementById("remember-device").checked;
            const password = passInput.value.trim();

            if (!password) return;

            errEl.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Verifying...";

            try {
                const success = await attemptDecryption(password);
                if (success) {
                    if (remember) {
                        try { localStorage.setItem(STORAGE_KEY, password); } catch (err) {}
                    } else {
                        try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
                    }
                }
            } catch (err) {
                errEl.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Unlock Command Center";
                passInput.focus();
                passInput.select();
            }
        }

        // Auto-unlock if passphrase previously saved on device
        window.addEventListener("DOMContentLoaded", async function() {
            let savedPass = null;
            try { savedPass = localStorage.getItem(STORAGE_KEY); } catch (err) {}
            if (savedPass) {
                const form = document.getElementById("unlock-form");
                const loading = document.getElementById("loading");
                if (form) form.style.display = "none";
                if (loading) loading.style.display = "block";

                try {
                    const ok = await attemptDecryption(savedPass);
                    if (!ok) throw new Error("Auto-decrypt failed");
                } catch (err) {
                    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                    if (loading) loading.style.display = "none";
                    if (form) form.style.display = "flex";
                }
            }
        });
    </script>
